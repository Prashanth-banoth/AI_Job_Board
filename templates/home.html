<!DOCTYPE html>
<html>
<head>
    <title>AI Job Board</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            text-align:center;
            padding-top:100px;
        }

        h1{
            color:#2c3e50;
            font-size:50px;
        }

        h3{
            color:#555;
        }

        button{
            padding:12px 25px;
            margin:10px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        .login{
            background:#3498db;
            color:white;
        }

        .register{
            background:#2ecc71;
            color:white;
        }
    </style>
</head>
<body>

    <h1>AI Job Board</h1>

    <h3>Find Your Dream Job Using AI</h3>

    <p>
        AI-powered platform for job recommendations,
        resume analysis and ATS scoring.
    </p>

    <a href="/login/">
        <button class="login">Login</button>
    </a>
    <a href="/register/">
        <button class="register">Register</button>
    </a>

</body>
</html>
